<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>3D Cube Model</h1>
    <p>Drag the cube to rotate it manually, or use the rotation buttons.</p>

    <div class="scene">
        <div class="cube" id="cube">
            <div class="face front">
                <img src="images/itta.jpeg" alt="Front">
            </div>
            <div class="face back">
                <img src="images/laal.jpeg" alt="Back">
            </div>
            <div class="face right">
                <img src="images/cherry.jpeg" alt="Right">
            </div>
            <div class="face left">
                <img src="images/kala.jpeg" alt="Left">
            </div>
            <div class="face top">
                <img src="images/king.jpeg" alt="Top">
            </div>
            <div class="face bottom">
                <img src="images/jhanda.jpeg" alt="Bottom">
            </div>
        </div>
    </div>

    <div class="rotation-controls">
        <button id="anticlockwise" type="button">↶ Anticlockwise</button>
        <button id="clockwise" type="button">↷ Clockwise</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
